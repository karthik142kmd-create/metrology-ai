version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrologyai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./metrology.db
      - JWT_SECRET_KEY=change-this-production-jwt-secret-key-32chars
      - OCR_PROVIDER=auto
      - AI_PROVIDER=builtin
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,*
    volumes:
      - backend-uploads:/app/uploads
      - backend-reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Service (Vite React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrologyai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-uploads:
  backend-reports:
